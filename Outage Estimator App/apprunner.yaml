version: 1.0
runtime: python3
build:
  commands:
    build:
      - pip install -r requirements_streamlit.txt
run:
  runtime-version: 3.10
  command: streamlit run app.py --server.port=8080 --server.address=0.0.0.0 --server.headless=true
  network:
    port: 8080
    env: PORT
  env:
    - name: PORT
      value: "8080"